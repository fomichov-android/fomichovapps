  <script>
    (function () {
      try {
        var search = window.location.search || "";
        var saved = localStorage.getItem("fomichov_lang");
        if (saved === "uk" || saved === "en") {
          window.location.replace("./" + saved + "/" + search);
          return;
        }
        var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
        var preferUk = langs.some(function (l) {
          var code = String(l).toLowerCase();
          return code.indexOf("uk") === 0 || code.indexOf("ua") === 0 || code.indexOf("ru") === 0;
        });
        window.location.replace((preferUk ? "./uk/" : "./en/") + search);
      } catch (e) {}
    })();
  </script>
